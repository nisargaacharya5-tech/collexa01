services:
  database:
    image: postgres:16-alpine
    container_name: colexa-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-colexa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-colexa_password}
      POSTGRES_DB: ${POSTGRES_DB:-colexa_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-colexa_user} -d ${POSTGRES_DB:-colexa_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - colexa-network

volumes:
  postgres_data:
    name: colexa_pgdata

networks:
  colexa-network:
    name: colexa-network
    driver: bridge
